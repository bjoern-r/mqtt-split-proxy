# Relative paths are resolved against the directory of this file.

listen:
  host: 0.0.0.0              # better: the LAN IP of this machine
  port: 8883
  cert: certs/server.crt     # self-signed, generated by certs/gen_selfsigned.sh
  key: certs/server.key
  tls_min_version: TLSv1_2   # lower to TLSv1 only if the device can't do 1.2

upstream:
  host: mqtt.vendor.example  # real hostname (SNI + certificate verification)
  port: 8883
  # The LAN DNS points host at this proxy, so the real address MUST come from
  # somewhere else: either a clean resolver or a static address.
  resolver: 1.1.1.1
  # address: 203.0.113.10
  verify: true
  # cafile: /path/to/ca.pem  # only needed if the vendor uses a private CA
  connect_timeout: 10

local_broker:
  host: 127.0.0.1
  port: 1883
  username: null
  password: null
  client_id: mqtt-split-proxy
  topic_prefix: "vendor/{client_id}/"   # placeholders: {client_id}, {username}
  qos: 0
  strip_retain: false
  queue_size: 10000

connect_timeout: 30        # seconds a device may take to send its CONNECT
tap_max_packet: 1048576    # larger PUBLISHes are relayed but not copied locally
stats_interval: 60
log_level: INFO
